name: Bug report
description: Something on the site is broken or displays wrongly
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Which page has the problem?
      placeholder: /databases#indexes
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox on Android
